name: Build tdisupport

on:
  workflow_dispatch:

env:
  # ==================================================
  # 1. TELE-DATA / RustDesk server
  # ==================================================
  RENDEZVOUS_SERVER: "tdisupport.ddns.net"
  RS_PUB_KEY: "Db+kfSNgJQlup2RHwYBlw0NGBG88P27vPI7V9pFLYxFA="

  # ==================================================
  # 1B. TELE & DATA branding
  # ==================================================
  APP_NAME: "TELE & DATA Support"

  # ==================================================
  # 2. RustDesk 1.4.8 build versions
  # ==================================================
  RUSTDESK_VERSION: "1.4.8"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"

  # ==================================================
  # 3. vcpkg
  # ==================================================
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_DEFAULT_TRIPLET: "x64-windows-static"

  # ==================================================
  # 4. Flutter Rust Bridge
  # ==================================================
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"


# ======================================================
# JOB 1
# Generate Flutter Rust Bridge
# ======================================================

jobs:

  # ----------------------------------------------------
  # 5. Generate bridge
  # ----------------------------------------------------
  generate-bridge:

    name: 5 - Generate bridge

    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------
      # 6. Checkout RustDesk 1.4.8
      # ------------------------------------------------
      - name: 6 - Checkout RustDesk 1.4.8
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: "1.4.8"
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------
      # 7. Install bridge prerequisites
      # ------------------------------------------------
      - name: 7 - Install prerequisites
        run: |
          sudo apt-get update -y

          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      # ------------------------------------------------
      # 8. Install Rust 1.75
      # ------------------------------------------------
      - name: 8 - Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-unknown-linux-gnu
          components: rustfmt

      # ------------------------------------------------
      # 9. Install Flutter 3.22.3 for bridge
      # ------------------------------------------------
      - name: 9 - Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      # ------------------------------------------------
      # 10. Install Flutter Rust Bridge
      # ------------------------------------------------
      - name: 10 - Install Flutter Rust Bridge
        shell: bash
        run: |
          cargo install cargo-expand \
            --version "${CARGO_EXPAND_VERSION}" \
            --locked

          cargo install flutter_rust_bridge_codegen \
            --version "${FLUTTER_RUST_BRIDGE_VERSION}" \
            --features "uuid" \
            --locked

      # ------------------------------------------------
      # 11. Prepare Flutter dependencies
      # ------------------------------------------------
      - name: 11 - Prepare Flutter
        shell: bash
        run: |
          sed -i \
            -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' \
            flutter/pubspec.yaml

          pushd flutter
          flutter pub get
          popd

      # ------------------------------------------------
      # 12. Generate bridge files
      # ------------------------------------------------
      - name: 12 - Generate bridge
        shell: bash
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

          cp \
            ./flutter/macos/Runner/bridge_generated.h \
            ./flutter/ios/Runner/bridge_generated.h

          echo ""
          echo "=========================================="
          echo "Bridge files generated:"
          echo "=========================================="

          ls -lh src/bridge_generated.rs
          ls -lh src/bridge_generated.io.rs
          ls -lh flutter/lib/generated_bridge.dart
          ls -lh flutter/lib/generated_bridge.freezed.dart

      # ------------------------------------------------
      # 13. Upload bridge artifact
      # ------------------------------------------------
      - name: 13 - Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h


# ======================================================
# JOB 2
# Build Windows x64
# ======================================================

  build:

    name: Build tdisupport

    needs: generate-bridge

    runs-on: windows-2022

    steps:

      # ------------------------------------------------
      # 14. Checkout TELE-DATA repository
      # ------------------------------------------------
      - name: 14 - Checkout TELE-DATA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ------------------------------------------------
      # 15. Save TELE & DATA branding
      # ------------------------------------------------
      - name: 15 - Save TELE & DATA branding
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Sparar TELE & DATA branding"
          Write-Host "=========================================="

          $source = ".\branding"
          $backup = Join-Path $env:RUNNER_TEMP "teledata-branding"

          if (-not (Test-Path $source)) {
            Write-Error "branding-mappen finns inte: $source"
            exit 1
          }

          if (Test-Path $backup) {
            Remove-Item $backup -Recurse -Force
          }

          Copy-Item $source $backup -Recurse -Force

          Write-Host "Branding sparad till: $backup"
          Get-ChildItem $backup


      # ------------------------------------------------
      # 16. Checkout RustDesk 1.4.8
      # ------------------------------------------------
      - name: 16 - Checkout RustDesk 1.4.8
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: "1.4.8"
          submodules: recursive
          fetch-depth: 0


      # ------------------------------------------------
      # 17. Restore bridge files
      # ------------------------------------------------
      - name: 17 - Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      # ------------------------------------------------
      # 18. Verify bridge files
      # ------------------------------------------------
      - name: 18 - Verify bridge files
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Kontrollerar bridge-filer"
          Write-Host "=========================================="

          $files = @(
            ".\src\bridge_generated.rs",
            ".\src\bridge_generated.io.rs",
            ".\flutter\lib\generated_bridge.dart",
            ".\flutter\lib\generated_bridge.freezed.dart"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              Write-Error "Saknar bridge-fil: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

          Write-Host "Alla bridge-filer finns."


      # ------------------------------------------------
      # 19. Restore TELE & DATA branding
      # ------------------------------------------------
      - name: 19 - Restore TELE & DATA branding
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Återställer TELE & DATA branding"
          Write-Host "=========================================="

          $backup = Join-Path $env:RUNNER_TEMP "teledata-branding"
          $destination = ".\branding"

          if (-not (Test-Path $backup)) {
            Write-Error "Branding-backup saknas: $backup"
            exit 1
          }

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          Copy-Item $backup $destination -Recurse -Force

          Write-Host "Branding återställd."
          Get-ChildItem $destination


      # ------------------------------------------------
      # 20. Verify TELE & DATA branding
      # ------------------------------------------------
      - name: 20 - Verify TELE & DATA branding
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Kontrollerar TELE & DATA branding"
          Write-Host "=========================================="

          $required = @(
            ".\branding\teledata-logo.png",
            ".\branding\teledata-logo.svg",
            ".\branding\teledata-icon.png",
            ".\branding\teledata-icon.ico",
            ".\branding\teledata-icon.svg"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Saknar branding-fil: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

          Write-Host "Alla TELE & DATA branding-filer finns."


      # ------------------------------------------------
      # 21. Install LLVM
      # ------------------------------------------------
      - name: 21 - Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}


      # ------------------------------------------------
      # 22. Install Flutter 3.24.5
      # ------------------------------------------------
      - name: 22 - Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64


      # ------------------------------------------------
      # 23. Replace Flutter engine
      # ------------------------------------------------
      - name: 23 - Replace Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Write-Host "Laddar RustDesk custom Flutter engine..."

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release `
            -Force

          $flutterRoot = "${{ steps.flutter.outputs.CACHE-PATH }}"

          $destination = Join-Path `
            $flutterRoot `
            "bin\cache\artifacts\engine\windows-x64-release"

          Write-Host "Flutter root:"
          Write-Host $flutterRoot

          Write-Host "Engine destination:"
          Write-Host $destination

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Copy-Item `
            -Path "windows-x64-release\*" `
            -Destination $destination `
            -Force `
            -Recurse

          Write-Host "Custom Flutter engine installerad."


      # ------------------------------------------------
      # 24. Patch Flutter
      # ------------------------------------------------
      - name: 24 - Patch Flutter
        shell: bash
        run: |
          cp \
            .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "$(dirname "$(dirname "$(which flutter)")")"

          cd "$(dirname "$(dirname "$(which flutter)")")"

          git apply \
            flutter_3.24.4_dropdown_menu_enableFilter.diff


      # ------------------------------------------------
      # 25. Install Rust
      # ------------------------------------------------
      - name: 25 - Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt


      # ------------------------------------------------
      # 26. Rust cache
      # ------------------------------------------------
      - name: 26 - Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-1.4.8-windows


      # ------------------------------------------------
      # 27. Setup vcpkg
      # ------------------------------------------------
      - name: 27 - Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false


      # ------------------------------------------------
      # 28. Install vcpkg dependencies
      # ------------------------------------------------
      - name: 28 - Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          echo "=========================================="
          echo "Installerar vcpkg dependencies"
          echo "=========================================="

          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then

            echo ""
            echo "VCPKG INSTALLATION MISSLYCKADES"
            echo "=========================================="

            find "${VCPKG_ROOT}/" -name "*.log" | while read -r logfile; do
              echo ""
              echo "LOGG: $logfile"
              echo "=========================================="
              cat "$logfile"
              echo "=========================================="
            done

            exit 1
          fi

          echo ""
          echo "FFmpeg build log:"
          echo "=========================================="

          head -n 100 \
            "$VCPKG_ROOT/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" \
            || true


      # ------------------------------------------------
      # 29. Configure TELE-DATA server
      # ------------------------------------------------
      - name: 29 - Configure TELE-DATA server
        shell: pwsh
        run: |
          $config = ".\libs\hbb_common\src\config.rs"

          if (-not (Test-Path $config)) {
            Write-Error "Hittar inte $config"
            exit 1
          }

          Write-Host "Konfigurerar RustDesk för TELE-DATA"

          $content = Get-Content $config -Raw

          # RENDEZVOUS_SERVERS
          $content = [regex]::Replace(
            $content,
            '(?m)^\s*pub const RENDEZVOUS_SERVERS.*?;\s*$',
            'pub const RENDEZVOUS_SERVERS: &[&str] = &["' +
            $env:RENDEZVOUS_SERVER +
            '"];'
          )

          # RS_PUB_KEY
          $content = [regex]::Replace(
            $content,
            '(?m)^\s*pub const RS_PUB_KEY.*?;\s*$',
            'pub const RS_PUB_KEY: &str = "' +
            $env:RS_PUB_KEY +
            '";'
          )

          Set-Content `
            -Path $config `
            -Value $content `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TELE-DATA configuration"
          Write-Host "=========================================="

          Select-String `
            -Path $config `
            -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY|RENDEZVOUS_PORT|RELAY_PORT"


      # ------------------------------------------------
      # 30. Verify server configuration
      # ------------------------------------------------
      - name: 30 - Verify server configuration
        shell: pwsh
        run: |
          $config = ".\libs\hbb_common\src\config.rs"

          $content = Get-Content $config -Raw

          if ($content -notmatch [regex]::Escape($env:RENDEZVOUS_SERVER)) {
            Write-Error "tdisupport.ddns.net finns inte i config.rs"
            exit 1
          }

          if ($content -notmatch [regex]::Escape($env:RS_PUB_KEY)) {
            Write-Error "RS_PUB_KEY finns inte i config.rs"
            exit 1
          }

          Write-Host "Serverkonfiguration verifierad."



      # ------------------------------------------------
      # 31. Apply TELE & DATA branding
      # ------------------------------------------------
      - name: 31 - Apply TELE & DATA branding
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "TELE & DATA branding"
          Write-Host "=========================================="

          $required = @(
            ".\branding\teledata-logo.png",
            ".\branding\teledata-logo.svg",
            ".\branding\teledata-icon.png",
            ".\branding\teledata-icon.ico",
            ".\branding\teledata-icon.svg"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Saknar branding-fil: $file"
              Write-Error "Lägg filerna i mappen branding/ i GitHub-repot."
              exit 1
            }
            Write-Host "OK: $file"
          }

          # --------------------------------------------
          # 27A. Application name
          # --------------------------------------------
          $config = ".\libs\hbb_common\src\config.rs"

          if (-not (Test-Path $config)) {
            Write-Error "Hittar inte $config"
            exit 1
          }

          $content = Get-Content $config -Raw

          # RustDesk 1.4.8 uses:
          # pub static ref APP_NAME: RwLock<String> = RwLock::new("RustDesk".to_owned());
          # Replace only the default string inside the existing declaration.
          $pattern = '(?m)(pub\s+static\s+ref\s+APP_NAME\s*:\s*RwLock<String>\s*=\s*RwLock::new\(")[^"]*(".*?\);)'

          $updated = [regex]::Replace(
            $content,
            $pattern,
            '$1' + $env:APP_NAME + '$2'
          )

          if ($updated -eq $content) {
            Write-Host "APP_NAME-rader som hittades i config.rs:"
            $content -split "`r?`n" | Where-Object { $_ -match 'APP_NAME' }
            Write-Error "Hittade ingen APP_NAME-deklaration i config.rs"
            exit 1
          }

          Set-Content -Path $config -Value $updated -Encoding UTF8

          Write-Host "APP_NAME ändrad till: $env:APP_NAME"

          # --------------------------------------------
          # 27B. Main logo used by the Flutter client
          # --------------------------------------------
          Copy-Item ".\branding\teledata-logo.png" ".\flutter\assets\logo.png" -Force
          Copy-Item ".\branding\teledata-logo.svg" ".\flutter\assets\logo.svg" -Force

          # --------------------------------------------
          # 27C. Windows / tray icons
          # --------------------------------------------
          Copy-Item ".\branding\teledata-icon.png" ".\res\icon.png" -Force
          Copy-Item ".\branding\teledata-icon.ico" ".\res\icon.ico" -Force
          Copy-Item ".\branding\teledata-icon.ico" ".\flutter\assets\logo.ico" -Force
          Copy-Item ".\branding\teledata-icon.svg" ".\flutter\assets\icon.svg" -Force
          Copy-Item ".\branding\teledata-icon.svg" ".\res\scalable.svg" -Force

          $runnerIcon = ".\flutter\windows\runner\resources\app_icon.ico"
          if (Test-Path $runnerIcon) {
            Copy-Item ".\branding\teledata-icon.ico" $runnerIcon -Force
            Write-Host "OK: Windows runner icon ersatt."
          } else {
            Write-Host "OBS: $runnerIcon finns inte i denna RustDesk-version."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Branding klar"
          Write-Host "App name: $env:APP_NAME"
          Write-Host "=========================================="

          Select-String -Path $config -Pattern "APP_NAME"

      # ------------------------------------------------
      # 32. Build RustDesk
      # ------------------------------------------------
      - name: 32 - Build RustDesk
        shell: bash
        run: |
          echo "=========================================="
          echo "BYGGER TELE & DATA Support"
          echo "=========================================="

          python3 ./build.py \
            --portable \
            --flutter \
            --skip-portable-pack \
            --hwcodec \
            --vram

          echo ""
          echo "Build klar."

          mv \
            ./flutter/build/windows/x64/runner/Release \
            ./rustdesk

          echo ""
          echo "=========================================="
          echo "FÄRDIG KLIENT"
          echo "=========================================="

          ls -lh ./rustdesk/


      # ------------------------------------------------
      # 33. Rename executable
      # ------------------------------------------------
      - name: 33 - Rename executable
        shell: pwsh
        run: |
          $exe = ".\rustdesk\rustdesk.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "rustdesk.exe hittades inte"
            exit 1
          }

          Rename-Item `
            -Path $exe `
            -NewName "tdisupport.exe"

          Write-Host "Klienten heter nu tdisupport.exe"


      # ------------------------------------------------
      # 34. Install Inno Setup 7
      # ------------------------------------------------
      - name: 34 - Install Inno Setup 7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLERAR INNO SETUP 7"
          Write-Host "=========================================="

          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "Inno Setup-installern laddades inte ner."
            exit 1
          }

          $size = (Get-Item $installer).Length
          Write-Host "Nedladdad installer: $size bytes"

          if ($size -lt 1000000) {
            Write-Error "Inno Setup-installern verkar vara felaktig eller ofullständig."
            exit 1
          }

          Write-Host "Installerar Inno Setup..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS" `
            -Wait `
            -NoNewWindow

          Write-Host "Letar efter ISCC.exe..."

          $possiblePaths = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 7\ISCC.exe"
          )

          $iscc = $null

          foreach ($path in $possiblePaths) {
            if ($path -and (Test-Path $path)) {
              $iscc = $path
              break
            }
          }

          if (-not $iscc) {
            Write-Host "ISCC.exe hittades inte på standardplatserna."
            Write-Host "Söker på hela runnern..."

            $found = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)",$env:LOCALAPPDATA `
              -Recurse `
              -Filter "ISCC.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $iscc = $found.FullName
            }
          }

          if (-not $iscc) {
            Write-Error "Inno Setup 7 ISCC.exe hittades inte."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INNO SETUP HITTADES"
          Write-Host "$iscc"
          Write-Host "=========================================="

      # ------------------------------------------------
      # 35. Create ONE TELE & DATA customer EXE
      # ------------------------------------------------
      - name: 35 - Create TELE & DATA Support EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SKAPAR EN FIL FÖR KUNDEN"
          Write-Host "TELE-DATA-Support.exe"
          Write-Host "=========================================="

          $iscc = "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          $work = Join-Path $env:RUNNER_TEMP "tdisupport-inno"
          $script = Join-Path $work "TELE-DATA-Support.iss"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "customer-exe"
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "rustdesk"

          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $outputDir -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $work | Out-Null
          New-Item -ItemType Directory -Path $outputDir | Out-Null

          if (-not (Test-Path (Join-Path $sourceDir "tdisupport.exe"))) {
            Write-Error "tdisupport.exe saknas i RustDesk-klienten."
            exit 1
          }

          $iss = @(
            '[Setup]'
            'AppName=TELE & DATA Support'
            'AppVersion=1.0'
            'DefaultDirName={localappdata}\TELE-DATA Support'
            'DisableProgramGroupPage=yes'
            'DisableDirPage=yes'
            'DisableReadyPage=yes'
            'DisableFinishedPage=yes'
            'Uninstallable=no'
            'PrivilegesRequired=lowest'
            'OutputDir=' + $outputDir
            'OutputBaseFilename=TELE-DATA-Support'
            'Compression=lzma2'
            'SolidCompression=yes'
            'WizardStyle=modern'
            'SetupArchitecture=x64'
            ''
            '[Files]'
            'Source: "' + (Join-Path $sourceDir '*') + '"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion'
            ''
            '[Run]'
            'Filename: "{app}\tdisupport.exe"; Flags: nowait'
          ) -join "`r`n"

          [System.IO.File]::WriteAllText(
            $script,
            $iss,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Kompilerar installer..."
          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $output = Join-Path $outputDir "TELE-DATA-Support.exe"

          if (-not (Test-Path $output)) {
            Write-Error "TELE-DATA-Support.exe skapades inte."
            exit 1
          }

          Write-Host ""
          Write-Host "FÄRDIG KUND-FIL:"
          Get-Item $output | Select-Object Name, Length, FullName

      # ------------------------------------------------
      # 36. Upload ONE customer EXE
      # ------------------------------------------------
      - name: 36 - Upload TELE-DATA Support EXE
        uses: actions/upload-artifact@v4
        with:
          name: TELE-DATA-Support-Windows-x64
          path: ./customer-exe/TELE-DATA-Support.exe
