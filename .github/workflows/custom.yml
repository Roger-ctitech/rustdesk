name: Build tdisupport

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  RENDEZVOUS_SERVER: "tdisupport.ddns.net"
  RS_PUB_KEY: "Db+kfSNgJQlup2RHwYBlw0NGBG88P27vPI7V9pFLYxFA="

jobs:
  build:
    runs-on: windows-2022

    steps:

      # --------------------------------------------------
      # 1. Hämta exakt RustDesk 1.4.8
      # --------------------------------------------------
      - name: Checkout RustDesk 1.4.8
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.8
          submodules: recursive
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Kontrollera hbb_common
      # --------------------------------------------------
      - name: Check hbb_common
        shell: pwsh
        run: |
          $config = ".\libs\hbb_common\src\config.rs"

          if (-not (Test-Path $config)) {
            Write-Error "Hittar inte $config"
            exit 1
          }

          Write-Host "Hittade:"
          Write-Host $config

          Write-Host ""
          Write-Host "Nuvarande serverkonfiguration:"
          Select-String -Path $config `
            -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY"

      # --------------------------------------------------
      # 3. Kontrollera RustDesk-konfigurationen
      # --------------------------------------------------
      - name: Inspect RustDesk config
        shell: pwsh
        run: |
          $config = ".\libs\hbb_common\src\config.rs"

          if (-not (Test-Path $config)) {
            Write-Error "Hittar inte $config"
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "RustDesk config.rs"
          Write-Host "=========================================="

          Get-Content $config

          Write-Host "=========================================="

      # --------------------------------------------------
      # 4. Installera LLVM
      # --------------------------------------------------
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      # --------------------------------------------------
      # 5. Installera Flutter 3.24.5
      # --------------------------------------------------
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # --------------------------------------------------
      # 6. Förbered Flutter
      # --------------------------------------------------
      - name: Prepare Flutter
        shell: pwsh
        run: |
          flutter doctor -v
          flutter config --enable-windows-desktop
          flutter precache --windows

      # --------------------------------------------------
      # 7. Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      # --------------------------------------------------
      # 8. Rust cache
      # --------------------------------------------------
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-148-tdisupport

      # --------------------------------------------------
      # 9. VCPKG
      # --------------------------------------------------
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # --------------------------------------------------
      # 10. Install vcpkg dependencies
      # --------------------------------------------------
      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          echo "=========================================="
          echo "Installerar RustDesk vcpkg dependencies"
          echo "=========================================="

          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then

            echo ""
            echo "VCPKG INSTALLATION MISSLYCKADES"
            echo "=========================================="

            find "${VCPKG_ROOT}/" -name "*.log" | while read -r logfile; do
              echo ""
              echo "LOGG: $logfile"
              echo "=========================================="
              cat "$logfile"
              echo "=========================================="
            done

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Kontrollerar FFmpeg"
          echo "=========================================="

          if [ -f "$VCPKG_ROOT/installed/x64-windows-static/include/libavcodec/avcodec.h" ]; then
            echo "OK: libavcodec/avcodec.h finns"
          else
            echo "VARNING: libavcodec/avcodec.h saknas"
          fi

          if [ -f "$VCPKG_ROOT/installed/x64-windows-static/include/libavutil/avutil.h" ]; then
            echo "OK: libavutil/avutil.h finns"
          else
            echo "VARNING: libavutil/avutil.h saknas"
          fi

          if [ -f "$VCPKG_ROOT/installed/x64-windows-static/include/libavformat/avformat.h" ]; then
            echo "OK: libavformat/avformat.h finns"
          else
            echo "VARNING: libavformat/avformat.h saknas"
          fi

          echo ""
          echo "=========================================="
          echo "VCPKG KLART"
          echo "=========================================="

      # --------------------------------------------------
      # 11. Custom Flutter engine
      # --------------------------------------------------
      - name: Replace Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Write-Host "Laddar RustDesk Flutter engine..."

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Write-Host "Packar upp engine..."

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release `
            -Force

          $dst = "C:\hostedtoolcache\windows\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release"

          Write-Host "Skapar destination:"
          Write-Host $dst

          New-Item `
            -ItemType Directory `
            -Path $dst `
            -Force | Out-Null

          Write-Host "Kopierar engine..."

          Copy-Item `
            -Path "windows-x64-release\*" `
            -Destination $dst `
            -Force `
            -Recurse

          Write-Host "Flutter engine installerad."

      # --------------------------------------------------
      # 12. Flutter patch
      # --------------------------------------------------
      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
             $(dirname $(dirname $(which flutter)))

          cd $(dirname $(dirname $(which flutter)))

          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      # --------------------------------------------------
      # 13. Bygg RustDesk med officiella build.py
      # --------------------------------------------------
      - name: Build RustDesk
        shell: pwsh
        run: |
          python3 .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec `
            --vram

      # --------------------------------------------------
      # 14. Kontrollera resultatet
      # --------------------------------------------------
      - name: Check result
        shell: pwsh
        run: |

          $source = ".\flutter\build\windows\x64\runner\Release"

          if (-not (Test-Path "$source\rustdesk.exe")) {
            Write-Error "rustdesk.exe skapades inte!"
            exit 1
          }

          Write-Host ""
          Write-Host "BUILD LYCKADES!"
          Get-Item "$source\rustdesk.exe"

      # --------------------------------------------------
      # 15. Byt namn till tdisupport.exe
      # --------------------------------------------------
      - name: Create tdisupport.exe
        shell: pwsh
        run: |

          Copy-Item `
            ".\flutter\build\windows\x64\runner\Release\rustdesk.exe" `
            ".\tdisupport.exe"

          Write-Host ""
          Write-Host "tdisupport.exe skapad!"

      # --------------------------------------------------
      # 16. Ladda upp
      # --------------------------------------------------
      - name: Upload tdisupport
        uses: actions/upload-artifact@v4
        with:
          name: tdisupport
          path: .\tdisupport.exe
