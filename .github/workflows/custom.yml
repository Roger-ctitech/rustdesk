name: Build tdisupport

on:
  workflow_dispatch:

env:
  # ==================================================
  # 1. TELE-DATA / RustDesk server
  # ==================================================
  RENDEZVOUS_SERVER: "tdisupport.ddns.net"
  RS_PUB_KEY: "Db+kfSNgJQlup2RHwYBlw0NGBG88P27vPI7V9pFLYxFA="

  # ==================================================
  # 1B. TELE & DATA branding
  # ==================================================
  APP_NAME: "TELE & DATA Support"

  # ==================================================
  # 2. RustDesk 1.4.8 build versions
  # ==================================================
  RUSTDESK_VERSION: "1.4.8"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"

  # ==================================================
  # 3. vcpkg
  # ==================================================
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_DEFAULT_TRIPLET: "x64-windows-static"

  # ==================================================
  # 4. Flutter Rust Bridge
  # ==================================================
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"


# ======================================================
# JOB 1
# Generate Flutter Rust Bridge
# ======================================================

jobs:

  # ----------------------------------------------------
  # 5. Generate bridge
  # ----------------------------------------------------
  generate-bridge:

    name: 5 - Generate bridge

    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------
      # 6. Checkout RustDesk 1.4.8
      # ------------------------------------------------
      - name: 6 - Checkout RustDesk 1.4.8
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: "1.4.8"
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------
      # 7. Install bridge prerequisites
      # ------------------------------------------------
      - name: 7 - Install prerequisites
        run: |
          sudo apt-get update -y

          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      # ------------------------------------------------
      # 8. Install Rust 1.75
      # ------------------------------------------------
      - name: 8 - Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-unknown-linux-gnu
          components: rustfmt

      # ------------------------------------------------
      # 9. Install Flutter 3.22.3 for bridge
      # ------------------------------------------------
      - name: 9 - Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      # ------------------------------------------------
      # 10. Install Flutter Rust Bridge
      # ------------------------------------------------
      - name: 10 - Install Flutter Rust Bridge
        shell: bash
        run: |
          cargo install cargo-expand \
            --version "${CARGO_EXPAND_VERSION}" \
            --locked

          cargo install flutter_rust_bridge_codegen \
            --version "${FLUTTER_RUST_BRIDGE_VERSION}" \
            --features "uuid" \
            --locked

      # ------------------------------------------------
      # 11. Prepare Flutter dependencies
      # ------------------------------------------------
      - name: 11 - Prepare Flutter
        shell: bash
        run: |
          sed -i \
            -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' \
            flutter/pubspec.yaml

          pushd flutter
          flutter pub get
          popd

      # ------------------------------------------------
      # 12. Generate bridge files
      # ------------------------------------------------
      - name: 12 - Generate bridge
        shell: bash
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

          cp \
            ./flutter/macos/Runner/bridge_generated.h \
            ./flutter/ios/Runner/bridge_generated.h

          echo ""
          echo "=========================================="
          echo "Bridge files generated:"
          echo "=========================================="

          ls -lh src/bridge_generated.rs
          ls -lh src/bridge_generated.io.rs
          ls -lh flutter/lib/generated_bridge.dart
          ls -lh flutter/lib/generated_bridge.freezed.dart

      # ------------------------------------------------
      # 13. Upload bridge artifact
      # ------------------------------------------------
      - name: 13 - Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h


# ======================================================
# JOB 2
# Build Windows x64
# ======================================================

  build:

    name: Build tdisupport

    needs: generate-bridge

    runs-on: windows-2022

    steps:

      # ------------------------------------------------
      # 14. Checkout RustDesk 1.4.8
      # ------------------------------------------------
      - name: 14 - Checkout RustDesk 1.4.8
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: "1.4.8"
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------
      # 15. Restore bridge files
      # ------------------------------------------------
      - name: 15 - Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      # ------------------------------------------------
      # 16. Verify bridge files
      # ------------------------------------------------
      - name: 16 - Verify bridge files
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Kontrollerar bridge-filer"
          Write-Host "=========================================="

          $files = @(
            ".\src\bridge_generated.rs",
            ".\src\bridge_generated.io.rs",
            ".\flutter\lib\generated_bridge.dart",
            ".\flutter\lib\generated_bridge.freezed.dart"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              Write-Error "Saknar bridge-fil: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

          Write-Host "Alla bridge-filer finns."


      # ------------------------------------------------
      # 17. Install LLVM
      # ------------------------------------------------
      - name: 17 - Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}


      # ------------------------------------------------
      # 18. Install Flutter 3.24.5
      # ------------------------------------------------
      - name: 18 - Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64


      # ------------------------------------------------
      # 19. Replace Flutter engine
      # ------------------------------------------------
      - name: 19 - Replace Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Write-Host "Laddar RustDesk custom Flutter engine..."

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release `
            -Force

          $flutterRoot = "${{ steps.flutter.outputs.CACHE-PATH }}"

          $destination = Join-Path `
            $flutterRoot `
            "bin\cache\artifacts\engine\windows-x64-release"

          Write-Host "Flutter root:"
          Write-Host $flutterRoot

          Write-Host "Engine destination:"
          Write-Host $destination

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Copy-Item `
            -Path "windows-x64-release\*" `
            -Destination $destination `
            -Force `
            -Recurse

          Write-Host "Custom Flutter engine installerad."


      # ------------------------------------------------
      # 20. Patch Flutter
      # ------------------------------------------------
      - name: 20 - Patch Flutter
        shell: bash
        run: |
          cp \
            .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "$(dirname "$(dirname "$(which flutter)")")"

          cd "$(dirname "$(dirname "$(which flutter)")")"

          git apply \
            flutter_3.24.4_dropdown_menu_enableFilter.diff


      # ------------------------------------------------
      # 21. Install Rust
      # ------------------------------------------------
      - name: 21 - Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt


      # ------------------------------------------------
      # 22. Rust cache
      # ------------------------------------------------
      - name: 22 - Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-1.4.8-windows


      # ------------------------------------------------
      # 23. Setup vcpkg
      # ------------------------------------------------
      - name: 23 - Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false


      # ------------------------------------------------
      # 24. Install vcpkg dependencies
      # ------------------------------------------------
      - name: 24 - Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          echo "=========================================="
          echo "Installerar vcpkg dependencies"
          echo "=========================================="

          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then

            echo ""
            echo "VCPKG INSTALLATION MISSLYCKADES"
            echo "=========================================="

            find "${VCPKG_ROOT}/" -name "*.log" | while read -r logfile; do
              echo ""
              echo "LOGG: $logfile"
              echo "=========================================="
              cat "$logfile"
              echo "=========================================="
            done

            exit 1
          fi

          echo ""
          echo "FFmpeg build log:"
          echo "=========================================="

          head -n 100 \
            "$VCPKG_ROOT/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" \
            || true


      # ------------------------------------------------
      # 25. Configure TELE-DATA server
      # ------------------------------------------------
      - name: 25 - Configure TELE-DATA server
        shell: pwsh
        run: |
          $config = ".\libs\hbb_common\src\config.rs"

          if (-not (Test-Path $config)) {
            Write-Error "Hittar inte $config"
            exit 1
          }

          Write-Host "Konfigurerar RustDesk för TELE-DATA"

          $content = Get-Content $config -Raw

          # RENDEZVOUS_SERVERS
          $content = [regex]::Replace(
            $content,
            '(?m)^\s*pub const RENDEZVOUS_SERVERS.*?;\s*$',
            'pub const RENDEZVOUS_SERVERS: &[&str] = &["' +
            $env:RENDEZVOUS_SERVER +
            '"];'
          )

          # RS_PUB_KEY
          $content = [regex]::Replace(
            $content,
            '(?m)^\s*pub const RS_PUB_KEY.*?;\s*$',
            'pub const RS_PUB_KEY: &str = "' +
            $env:RS_PUB_KEY +
            '";'
          )

          Set-Content `
            -Path $config `
            -Value $content `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TELE-DATA configuration"
          Write-Host "=========================================="

          Select-String `
            -Path $config `
            -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY|RENDEZVOUS_PORT|RELAY_PORT"


      # ------------------------------------------------
      # 26. Verify server configuration
      # ------------------------------------------------
      - name: 26 - Verify server configuration
        shell: pwsh
        run: |
          $config = ".\libs\hbb_common\src\config.rs"

          $content = Get-Content $config -Raw

          if ($content -notmatch [regex]::Escape($env:RENDEZVOUS_SERVER)) {
            Write-Error "tdisupport.ddns.net finns inte i config.rs"
            exit 1
          }

          if ($content -notmatch [regex]::Escape($env:RS_PUB_KEY)) {
            Write-Error "RS_PUB_KEY finns inte i config.rs"
            exit 1
          }

          Write-Host "Serverkonfiguration verifierad."



      # ------------------------------------------------
      # 27. Apply TELE & DATA branding
      # ------------------------------------------------
      - name: 27 - Apply TELE & DATA branding
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "TELE & DATA branding"
          Write-Host "=========================================="

          $required = @(
            ".\branding\teledata-logo.png",
            ".\branding\teledata-logo.svg",
            ".\branding\teledata-icon.png",
            ".\branding\teledata-icon.ico",
            ".\branding\teledata-icon.svg"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Saknar branding-fil: $file"
              Write-Error "Lägg filerna i mappen branding/ i GitHub-repot."
              exit 1
            }
            Write-Host "OK: $file"
          }

          # --------------------------------------------
          # 27A. Application name
          # --------------------------------------------
          $config = ".\libs\hbb_common\src\config.rs"

          if (-not (Test-Path $config)) {
            Write-Error "Hittar inte $config"
            exit 1
          }

          $content = Get-Content $config -Raw

          $newAppName = 'pub const APP_NAME: &str = "' + $env:APP_NAME + '";'

          $updated = [regex]::Replace(
            $content,
            '(?m)^\s*pub const APP_NAME\s*:\s*&str\s*=\s*"[^"]*"\s*;\s*$',
            $newAppName
          )

          if ($updated -eq $content) {
            Write-Error "Kunde inte ändra APP_NAME i config.rs"
            exit 1
          }

          Set-Content -Path $config -Value $updated -Encoding UTF8

          # --------------------------------------------
          # 27B. Main logo used by the Flutter client
          # --------------------------------------------
          Copy-Item ".\branding\teledata-logo.png" ".\flutter\assets\logo.png" -Force
          Copy-Item ".\branding\teledata-logo.svg" ".\flutter\assets\logo.svg" -Force

          # --------------------------------------------
          # 27C. Windows / tray icons
          # --------------------------------------------
          Copy-Item ".\branding\teledata-icon.png" ".\res\icon.png" -Force
          Copy-Item ".\branding\teledata-icon.ico" ".\res\icon.ico" -Force
          Copy-Item ".\branding\teledata-icon.ico" ".\flutter\assets\logo.ico" -Force
          Copy-Item ".\branding\teledata-icon.svg" ".\flutter\assets\icon.svg" -Force
          Copy-Item ".\branding\teledata-icon.svg" ".\res\scalable.svg" -Force

          $runnerIcon = ".\flutter\windows\runner\resources\app_icon.ico"
          if (Test-Path $runnerIcon) {
            Copy-Item ".\branding\teledata-icon.ico" $runnerIcon -Force
            Write-Host "OK: Windows runner icon ersatt."
          } else {
            Write-Host "OBS: $runnerIcon finns inte i denna RustDesk-version."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Branding klar"
          Write-Host "App name: $env:APP_NAME"
          Write-Host "=========================================="

          Select-String -Path $config -Pattern "APP_NAME"

      # ------------------------------------------------
      # 28. Build RustDesk
      # ------------------------------------------------
      - name: 28 - Build RustDesk
        shell: bash
        run: |
          echo "=========================================="
          echo "BYGGER TDIsupport"
          echo "=========================================="

          python3 ./build.py \
            --portable \
            --flutter \
            --skip-portable-pack \
            --hwcodec \
            --vram

          echo ""
          echo "Build klar."

          mv \
            ./flutter/build/windows/x64/runner/Release \
            ./rustdesk

          echo ""
          echo "=========================================="
          echo "FÄRDIG KLIENT"
          echo "=========================================="

          ls -lh ./rustdesk/


      # ------------------------------------------------
      # 29. Rename executable
      # ------------------------------------------------
      - name: 29 - Rename executable
        shell: pwsh
        run: |
          $exe = ".\rustdesk\rustdesk.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "rustdesk.exe hittades inte"
            exit 1
          }

          Rename-Item `
            -Path $exe `
            -NewName "tdisupport.exe"

          Write-Host "Klienten heter nu tdisupport.exe"


      # ------------------------------------------------
      # 30. Upload final client
      # ------------------------------------------------
      - name: 30 - Upload tdisupport
        uses: actions/upload-artifact@v4
        with:
          name: tdisupport-Windows-x64
          path: ./rustdesk/
