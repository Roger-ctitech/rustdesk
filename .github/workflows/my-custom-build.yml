name: My Custom Windows Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      RENDEZVOUS_SERVER: tdisupport.ddns.net:21116
      RELAY_SERVER: tdisupport.ddns.net:21117
      RS_PUB_KEY: Db+kfSNgJQlup2RHwYBlw0NGBG88P27vPI7V9pFLYxFA=
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout 1.4.8
        run: |
          git fetch --tags
          git checkout 1.4.8
          git submodule update --init --recursive

      - name: Install LLVM 15
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"
          directory: ${{ runner.temp }}/llvm

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Install Rust 1.75 + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: rustfmt

      - name: Install codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Generate bridge for 1.4.8
        shell: bash
        run: |
          cd flutter
          flutter pub get
          cd..
          export LIBCLANG_PATH="${{ runner.temp }}/llvm/bin"
          export PATH="${{ runner.temp }}/llvm/bin:$PATH"
          if [ -f src/flutter_ffi.rs ]; then INPUT=src/flutter_ffi.rs; else INPUT=src/flutter.rs; fi
          echo "Generating from $INPUT"
          flutter_rust_bridge_codegen --llvm-path "${{ runner.temp }}/llvm" --rust-input $INPUT --dart-output flutter/lib/generated_bridge.dart --c-output flutter/windows/runner/bridge_generated.h --rust-output src/bridge_generated.rs --class-name RustDesk
          ls -lh src/bridge_generated.rs
          echo "Bridge OK - size should be >500KB"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-1.4.8-final

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg deps
        shell: bash
        run: $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_DEFAULT_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"

      - name: Build custom (no hwcodec)
        shell: bash
        run: |
          python3./build.py --portable --flutter --skip-portable-pack
          mv./flutter/build/windows/x64/runner/Release./rustdesk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Roger-Support-Windows-1.4.8-custom
          path:./rustdesk/
