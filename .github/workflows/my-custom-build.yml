name: My Custom Windows Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      RENDEZVOUS_SERVER: tdisupport.ddns.net:21116
      RELAY_SERVER: tdisupport.ddns.net:21117
      RS_PUB_KEY: Db+kfSNgJQlup2RHwYBlw0NGBG88P27vPI7V9pFLYxFA=
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      LLVM_VERSION: "15.0.6"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: ${{ runner.temp }}/llvm

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (Test-Path "C:\vcpkg") { Remove-Item -Recurse -Force "C:\vcpkg" }
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          if (Test-Path "vcpkg.json") { Rename-Item vcpkg.json vcpkg.json.bak }
          if (Test-Path "vcpkg-configuration.json") { Rename-Item vcpkg-configuration.json vcpkg-configuration.json.bak }
          C:\vcpkg\vcpkg.exe install opus libvpx libyuv aom --triplet x64-windows-static
          if (Test-Path "vcpkg.json.bak") { Rename-Item vcpkg.json.bak vcpkg.json }
          if (Test-Path "vcpkg-configuration.json.bak") { Rename-Item vcpkg-configuration.json.bak vcpkg-configuration.json }

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Install bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Generate bridge with LLVM path
        shell: bash
        run: |
          cd flutter
          flutter pub get
          cd ..
          rm -f src/bridge_generated.rs src/bridge_generated.io.rs
          export LIBCLANG_PATH="${{ runner.temp }}/llvm/bin"
          export PATH="${{ runner.temp }}/llvm/bin:$PATH"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          ls $LIBCLANG_PATH | head
          # Officiella kommandot - notera --llvm-path och att input kan heta flutter_ffi.rs i vissa versioner
          if [ -f src/flutter_ffi.rs ]; then INPUT=src/flutter_ffi.rs; else INPUT=src/flutter.rs; fi
          echo "Using input $INPUT"
          flutter_rust_bridge_codegen --llvm-path "${{ runner.temp }}/llvm" --rust-input $INPUT --dart-output flutter/lib/generated_bridge.dart --c-output flutter/windows/runner/bridge_generated.h --rust-output src/bridge_generated.rs --class-name RustDesk
          ls -lh src/bridge_generated.rs

      - name: Build Windows
        shell: bash
        run: |
          export VCPKG_ROOT="C:/vcpkg"
          export LIBCLANG_PATH="${{ runner.temp }}/llvm/bin"
          python3 build.py --flutter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roger-Support-Windows
          path: flutter/build/windows/x64/runner/Release/
