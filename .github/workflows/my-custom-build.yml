name: My Custom Windows Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      RENDEZVOUS_SERVER: tdisupport.ddns.net:21116
      RELAY_SERVER: tdisupport.ddns.net:21117
      RS_PUB_KEY: Db+kfSNgJQlup2RHwYBlw0NGBG88P27vPI7V9pFLYxFA=
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "15.0"

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (Test-Path "C:\vcpkg") { Remove-Item -Recurse -Force "C:\vcpkg" }
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          if (Test-Path "vcpkg.json") { Rename-Item vcpkg.json vcpkg.json.bak }
          if (Test-Path "vcpkg-configuration.json") { Rename-Item vcpkg-configuration.json vcpkg-configuration.json.bak }
          C:\vcpkg\vcpkg.exe install opus libvpx libyuv aom --triplet x64-windows-static
          if (Test-Path "vcpkg.json.bak") { Rename-Item vcpkg.json.bak vcpkg.json }
          if (Test-Path "vcpkg-configuration.json.bak") { Rename-Item vcpkg-configuration.json.bak vcpkg-configuration.json }

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Fix typo and generate bridge
        shell: bash
        run: |
          cd flutter
          flutter pub get
          cd ..
          # Sök i HELA repot, inte bara src/
          echo "Searching whole repo..."
          grep -R "mutc_int" . --include="*.rs" | head -20 || echo "Not found in first search"
          grep -R "mutc_" . --include="*.rs" | head -30
          # Laga ALLA .rs filer överallt
          find . -type f -name "*.rs" -exec sed -i 's/\*mutc_int/*mut c_int/g' {} \;
          find . -type f -name "*.rs" -exec sed -i 's/\*mutc_char/*mut c_char/g' {} \;
          find . -type f -name "*.rs" -exec sed -i 's/\*mutc_void/*mut c_void/g' {} \;
          find . -type f -name "*.rs" -exec sed -i 's/\*constc_char/*const c_char/g' {} \;
          find . -type f -name "*.rs" -exec sed -i 's/\*constc_int/*const c_int/g' {} \;
          # Aggressiv fix - lägg till mellanslag efter mut och const om c_ följer direkt
          find . -type f -name "*.rs" -exec sed -i 's/mutc_/mut c_/g' {} \;
          find . -type f -name "*.rs" -exec sed -i 's/constc_/const c_/g' {} \;
          echo "After global fix:"
          grep -R "mutc_" . --include="*.rs" | head -5 || echo "All fixed globally!"
          rm -f src/bridge_generated.rs src/bridge_generated.io.rs
          flutter_rust_bridge_codegen --rust-input src/flutter.rs --dart-output flutter/lib/generated_bridge.dart --c-output flutter/windows/runner/bridge_generated.h --rust-output src/bridge_generated.rs --class-name RustDesk
          ls -lh src/bridge_generated.rs

      - name: Build Windows
        shell: bash
        run: |
          export VCPKG_ROOT="C:/vcpkg"
          python3 build.py --flutter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roger-Support-Windows
          path: flutter/build/windows/x64/runner/Release/
